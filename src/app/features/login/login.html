<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Admin Login</mat-card-title>
      <mat-card-subtitle>SvS Preparation</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" (keyup.enter)="submit()" autofocus autocomplete="username" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          [(ngModel)]="password"
          (keyup.enter)="submit()"
          autocomplete="current-password"
        />
      </mat-form-field>
      @if (error) {
        <p class="error">Invalid username or password.</p>
      }
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button color="primary" (click)="submit()" [disabled]="loading || !username || !password">
        @if (loading) {
          <mat-spinner diameter="20" />
        } @else {
          Login
        }
      </button>
    </mat-card-actions>
  </mat-card>
</div>
